only-batch-number: 14
climcovar:
    class: mean
    length: 30
econcovar:
    class: mean
    length: 15
timerate: day
climate: [ tasmax, tasmax_rcspline, tas, tas-poly-2, tas-poly-3, tas-poly-4 ]
models:
  - csvvs: /project/cil/home_dirs/mdefranciosi/repos/labor-code-release-2020/3_projection/1_run_projections/0_csvv/clim_interacted_model_agnonag_27_28_41_riskshare_lo.csvv
    covariates: [ loggdppc, climtasmax, climtas, climtas-poly-2, climtas-poly-3, climtas-poly-4 ]
    knots: [ 27, 28, 41 ]
    description: labor productivity
    specifications:
        minlost_lo:
            csvv-subset: [0, 2]
            csvv-reunit:
                - variable: outcome
                  new-unit: minutes worked by individual
            indepunit: C
            depenunit: minutes worked by individual
            description: low-risk labor productivity
            functionalform: cubicspline
            prefix: tasmax_rcspline
            variable: tasmax
        minlost_hi:
            csvv-subset: [2, 6]
            csvv-reunit:
                - variable: outcome
                  new-unit: minutes worked by individual
            indepunit: C
            depenunit: minutes worked by individual
            description: high-risk labor productivity
            functionalform: cubicspline
            prefix: tasmax_rcspline
            variable: tasmax
            clipping: corpsepose
            clip-mintemp: 27
            clip-maxtemp: 41
            clip-model: minlost_lo
            grounding: max
        riskshare_lo:
            csvv-subset: [6, 12]
            csvv-reunit:
                - variable: outcome
                  new-unit: unitless
            indepunit: C
            depenunit: unitless
            description: share of low-risk labor
            functionalform: coefficients
            variables:
                - 1 [scalar]
    calculation:
        - FractionSum:
            - Reword:
                - SpanInstabase:
                    calculation:
                      YearlyAverageDay:
                        model: minlost_lo
                    year1: 2001
                    year2: 2010
                    func: '-'
                    baseline_diagname: baseline-lo
                - lowriskimpacts
            - Clip:
                - YearlyAverageDay:
                    model: riskshare_lo
                - 0.01183432
                - 1.0
            - Reword:
                - SpanInstabase:
                    calculation:
                      YearlyAverageDay:
                        model: minlost_hi
                    year1: 2001
                    year2: 2010
                    func: '-'
                    baseline_diagname: baseline-hi
                - highriskimpacts
        - Rebase
        - KeepOnly:
            - rebased
            - clip
            - highriskimpacts
            - lowriskimpacts
